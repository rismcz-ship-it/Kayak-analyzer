<svg width="120" height="84" viewBox="0 0 120 84" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="kayak-analyzer mark">
  <title>kayak-analyzer mark</title>
  <defs>
    <clipPath id="hullCut-light">
      <path d="M10 22 L44 22 Q60 33 76 22 L110 22 C108 44 86 66 60 66 C34 66 12 44 10 22 Z" />
    </clipPath>
  </defs>
  <!-- the hull above the waterline: the cockpit notch reads "kayak" -->
  <path d="M10 22 L44 22 Q60 33 76 22 L110 22 C108 44 86 66 60 66 C34 66 12 44 10 22 Z" fill="#12181F" stroke="#12181F" stroke-width="3" stroke-linejoin="round" />
  <!-- the displaced volume below it: what the solver actually measures -->
  <rect x="0" y="48" width="120" height="40" fill="#0FA3B5" clip-path="url(#hullCut-light)" />
  <!-- the waterplane the hull floats on -->
  <line x1="2" y1="48" x2="118" y2="48" stroke="#12181F" stroke-width="4" stroke-linecap="round" />
</svg>